[project]
name = "agentic-aml-investigator"
version = "0.1.0"
description = "Practice project: multi-agent AML case investigation assistant on public data"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.34.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "rapidfuzz>=3.9",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "pandas>=2.2",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
[project.optional-dependencies]
eval = [
    "ragas>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aml_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
